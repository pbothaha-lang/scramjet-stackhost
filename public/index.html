<!doctype html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Breeze</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d16;font-family:Arial;color:white}#bar{height:60px;display:flex;align-items:center;gap:8px;padding:9px 12px;background:#101827;border-bottom:1px solid #293a56}.logo{font-weight:800;font-size:20px;color:#91b9ff;margin-right:5px}button{height:40px;border:0;border-radius:10px;background:#19263b;color:white;padding:0 14px;font-size:16px;cursor:pointer}button:hover{background:#263a59}#url{height:40px;flex:1;border:1px solid #314765;border-radius:12px;background:#09111e;color:white;padding:0 15px;font-size:15px;outline:none}#view{width:100%;height:calc(100% - 60px);border:0;background:white}</style></head><body><div id='bar'><div class='logo'>Breeze</div><button onclick='back()'>&#8592;</button><button onclick='forward()'>&#8594;</button><button onclick='reload()'>&#8635;</button><input id='url' placeholder='Search or enter URL'><button onclick='go()'>Go</button></div><iframe id='view'></iframe><script type='module' src='/scramjet/scramjet.bundle.js'></script><script>const input=document.getElementById('url');const frame=document.getElementById('view');function normalize(v){v=v.trim();if(!v)return null;if(!(v.startsWith('http:')||v.startsWith('https:'))){if(v.includes('.')&&!v.includes(' ')){v='https:'+String.fromCharCode(47,47)+v}else{v='https:'+String.fromCharCode(47,47)+'www.google.com/search?q='+encodeURIComponent(v)}}return v}async function go(){const url=normalize(input.value);if(!url)return;try{if(!navigator.serviceWorker.controller){try{const reg=await navigator.serviceWorker.register('/scramjet-sw.js',{scope:'/'});console.log('SW REGISTERED',reg);await reg.update();console.log('SW UPDATE CHECK DONE');await navigator.serviceWorker.ready;location.reload();return}catch(e){console.error('FULL SERVICE WORKER ERROR:',e);throw e}}const bm=await import('/baremux/index.mjs');const mux=new bm.BareMuxConnection('/baremux/worker.js');await mux.setTransport('/libcurl/index.mjs',[{wisp:(location.protocol==='https:'?'wss://':'ws://')+location.host+'/wisp/'}]);console.log('BAREMUX TRANSPORT:',await mux.getTransport());await new Promise(r=>setTimeout(r,300));const sj=await import('/sj-assets/scramjet.bundle.js');const controller=new sj.ScramjetController({prefix:'/scramjet/',files:{wasm:'/scramjet/scramjet.wasm.wasm',all:'/sj-assets/scramjet.all.js',sync:'/scramjet/scramjet.sync.js'}});await controller.init();const sjFrame=controller.createFrame(frame);sjFrame.go(url)}catch(e){console.error(e);alert('Scramjet error: '+e.message)}}function back(){try{frame.contentWindow.history.back()}catch(e){}}function forward(){try{frame.contentWindow.history.forward()}catch(e){}}function reload(){try{frame.contentWindow.location.reload()}catch(e){frame.src=frame.src}}input.addEventListener('keydown',e=>{if(e.key==='Enter')go()});</script></body></html>
